<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouthTrigger Arena — Football Academy &amp; Digital Locker Room</title>
  <meta name="description" content="Sekolah sepak bola modern berlisensi AFC &amp; PSSI dengan Digital Locker Room terintegrasi untuk pemain, pelatih, dan orang tua."/>
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a3e635'><path d='M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 3c3.87 0 7 3.13 7 7s-3.13 7-7 7-7-3.13-7-7 3.13-7 7-7zm0 2.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z'/></svg>"/>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            pitch: {
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            },
            volt: {
              DEFAULT: '#a3e635',
              light: '#d9f99d',
            }
          },
          keyframes: {
            floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
            fadeup: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
          },
          animation: {
            floaty: 'floaty 5s ease-in-out infinite',
            fadeup: 'fadeup 0.6s ease-out forwards',
          }
        }
      }
    }
  </script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="dark bg-zinc-950 text-zinc-100 antialiased font-sans select-none overflow-x-hidden min-h-screen">

  <!-- ================= TOP PERSISTENT NAVBAR ================= -->
  <header id="app-header" class="relative z-50"></header>

  <!-- ================= DYNAMIC VIEW CONTAINER ================= -->
  <main id="app-view" class="overflow-y-auto overflow-x-hidden" style="height: calc(100vh - 64px); height: calc(100dvh - 64px);"></main>

  <!-- ================= TOAST NOTIFICATION CONTAINER ================= -->
  <div id="toast-container" class="fixed top-16 right-4 max-w-sm w-auto z-50 space-y-2 pointer-events-none"></div>

  <!-- ================= MOBILE OVERLAY BACKDROP ================= -->
  <div id="mobile-overlay" class="hidden fixed inset-0 bg-black/70 z-40 backdrop-blur-sm transition-opacity"></div>

  <!-- ================= APPLICATION SCRIPTS ================= -->
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/discordChat.js"></script>
  <script src="js/components/paymentModule.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/visitor.js"></script>
  <script src="js/views/player.js"></script>
  <script src="js/views/coach.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
